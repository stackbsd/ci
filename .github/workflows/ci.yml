name: "CI"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Check formatting
        run: uvx ruff format --check .
      - name: Lint
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Start FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          cache-after-prepare: true
          prepare: pkg install -y python312 git-lite uv
      - name: Check shell syntax
        shell: freebsd {0}
        run: for f in *.sh; do sh -n "$f"; done
      - name: Test
        shell: freebsd {0}
        run: python3.12 -m unittest discover -s tests -t .
